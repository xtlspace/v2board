<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仪表盘 - 我的订阅 重置入口预览</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f0f3f8;
    color: #495057;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .preview-note {
    max-width: 1080px;
    margin: 24px auto 0;
    padding: 0 20px;
    font-size: 12px;
    color: #6c757d;
  }
  .preview-note strong { color: #212529; }
  .page {
    max-width: 1080px;
    margin: 12px auto 48px;
    padding: 0 20px;
  }
  .block {
    background: #fff;
    border-radius: 0;
    overflow: hidden;
  }
  .block-header {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    padding: 7px 15px;
    background: #f8f9fc;
    border-bottom: 1px solid #e4e9f3;
  }
  .block-title {
    flex: 1 1 auto;
    min-height: 1.75rem;
    margin: 0;
    font-size: 1.125rem;
    font-weight: 400;
    line-height: 1.75;
    color: #343a40;
  }
  .reset-link {
    color: #495057;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    margin-left: 1em;
    font-size: 0.875rem;
    font-weight: 400;
  }
  .reset-link .reset-text {
    color: #0665d0;
  }
  .reset-link:hover .reset-text {
    color: #054d9e;
  }
  .block-content {
    padding: 24px;
  }
  .plan-name {
    margin: 0 0 12px;
    font-size: 1.5rem;
    font-weight: 400;
    color: #343a40;
  }
  .muted {
    color: #6c757d;
    font-size: 13px;
    margin: 0 0 4px;
  }
  .progress {
    height: 6px;
    background: #e9ecef;
    border-radius: 3px;
    overflow: hidden;
    margin: 18px 0 10px;
  }
  .progress-bar {
    width: 42%;
    height: 100%;
    background: #82b54b;
  }
  .usage {
    font-weight: 600;
    font-size: 13px;
    margin: 0;
  }
  .usage span + span { margin-left: 10px; }
  .url-row {
    margin-top: 20px;
    padding: 12px 14px;
    background: #f8f9fc;
    border: 1px solid #e4e9f3;
    border-radius: 4px;
    font-size: 13px;
    word-break: break-all;
  }
  .url-row strong {
    display: block;
    margin-bottom: 4px;
    color: #343a40;
  }
  .url {
    color: #0665d0;
    font-family: Menlo, Consolas, monospace;
  }

  /* antd confirm */
  .modal-mask {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 100px;
    background: rgba(0, 0, 0, .45);
    z-index: 1000;
  }
  .modal-mask.show { display: flex; }
  .confirm {
    width: 416px;
    max-width: calc(100vw - 32px);
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    padding: 20px 24px 16px;
  }
  .confirm-title {
    margin: 0 0 8px;
    color: rgba(0, 0, 0, .85);
    font-size: 16px;
    font-weight: 500;
  }
  .confirm-content {
    color: rgba(0, 0, 0, .65);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .confirm-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .btn {
    height: 32px;
    padding: 0 15px;
    border: 1px solid transparent;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-default {
    background: #fff;
    border-color: #d9d9d9;
    color: rgba(0, 0, 0, .65);
  }
  .btn-default:hover {
    border-color: #40a9ff;
    color: #40a9ff;
  }
  .btn-primary {
    background: #0665d0;
    border-color: #0665d0;
    color: #fff;
  }
  .btn-primary:hover { background: #054d9e; border-color: #054d9e; }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #fff;
    color: rgba(0, 0, 0, .85);
    box-shadow: 0 3px 6px -4px rgba(0, 0, 0, .12), 0 6px 16px 0 rgba(0, 0, 0, .08);
    border-radius: 4px;
    padding: 9px 16px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 1100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast .ok {
    color: #52c41a;
    margin-right: 8px;
  }
</style>
</head>
<body>
  <div class="preview-note">
    预览：<strong>括号为普通深灰色</strong>，只有「重置订阅」文字为蓝色。点击可查看与个人中心一致的重置弹窗。
  </div>

  <div class="page">
    <div class="block">
      <div class="block-header">
        <h3 class="block-title">我的订阅<a class="reset-link" href="javascript:void(0)" id="resetLink">（<span class="reset-text">重置订阅</span>）</a></h3>
      </div>
      <div class="block-content">
        <h3 class="plan-name">标准套餐</h3>
        <p class="muted">于 2026/12/31 到期，距离到期还有 36 天。</p>
        <p class="muted">已用流量将在 7 日后重置</p>
        <div class="progress"><div class="progress-bar"></div></div>
        <p class="usage">
          <span>已用 42.00 GB / 总计 100.00 GB</span>
          <span>在线设备 2/3</span>
        </p>
        <div class="url-row">
          <strong>订阅地址</strong>
          <span class="url" id="subscribeUrl">https://example.com/api/v1/client/subscribe?token=preview_token_old</span>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="modal">
    <div class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 class="confirm-title" id="confirmTitle">确定要重置订阅信息？</h3>
      <div class="confirm-content">如果你的订阅地址或信息泄露可以进行此操作。重置后你的UUID及订阅将会变更，需要重新进行订阅。</div>
      <div class="confirm-footer">
        <button class="btn btn-default" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="okBtn">确认</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><span class="ok">✓</span>重置成功</div>

<script>
  var modal = document.getElementById('modal');
  var toast = document.getElementById('toast');

  document.getElementById('resetLink').addEventListener('click', function () {
    modal.classList.add('show');
  });

  document.getElementById('cancelBtn').addEventListener('click', function () {
    modal.classList.remove('show');
  });

  document.getElementById('okBtn').addEventListener('click', function () {
    modal.classList.remove('show');
    document.getElementById('subscribeUrl').textContent =
      'https://example.com/api/v1/client/subscribe?token=preview_token_new';
    toast.classList.add('show');
    setTimeout(function () {
      toast.classList.remove('show');
    }, 1800);
  });

  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.classList.remove('show');
  });
</script>
</body>
</html>
